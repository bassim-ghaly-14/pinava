<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <defs>
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#bf953f"/>
            <stop offset="50%" stop-color="#fcf6ba"/>
            <stop offset="100%" stop-color="#b38728"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect
        width="32"
        height="32"
        rx="7"
        fill="#070707"
    />

    <!-- Cart Handle -->
    <path
        d="M6 8.5 H8.5 L11.2 21
           C11.45 22.1 12.4 22.8 13.5 22.8
           H23.5"
        fill="none"
        stroke="url(#gold)"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Cart Basket -->
    <path
        d="M9.5 11
           H25
           L23.1 19.5
           H11.3
           Z"
        fill="none"
        stroke="url(#gold)"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Product Detail -->
    <path
        d="M13 14.5 H22
           M13.8 17.5 H21.3"
        fill="none"
        stroke="url(#gold)"
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.85"
    />

    <!-- Wheels -->
    <circle
        cx="13.5"
        cy="26"
        r="1.55"
        fill="#070707"
        stroke="url(#gold)"
        stroke-width="1.35"
    />

    <circle
        cx="22"
        cy="26"
        r="1.55"
        fill="#070707"
        stroke="url(#gold)"
        stroke-width="1.35"
    />
</svg>