<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <defs>
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#bf953f"/>
            <stop offset="50%" stop-color="#fcf6ba"/>
            <stop offset="100%" stop-color="#b38728"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect
        width="32"
        height="32"
        rx="7"
        fill="#070707"
    />

    <!-- Cinematic Screen -->
    <rect
        x="6"
        y="7"
        width="20"
        height="17"
        rx="3"
        fill="none"
        stroke="url(#gold)"
        stroke-width="1.6"
    />

    <!-- Play Symbol -->
    <path
        d="M13 11.5
           L21 15.5
           L13 19.5
           Z"
        fill="none"
        stroke="url(#gold)"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Cinematic Base -->
    <path
        d="M10 27
           H22"
        fill="none"
        stroke="url(#gold)"
        stroke-width="1.5"
        stroke-linecap="round"
    />

    <!-- Stand -->
    <path
        d="M14 24
           L13 27
           M18 24
           L19 27"
        fill="none"
        stroke="url(#gold)"
        stroke-width="1.1"
        stroke-linecap="round"
        opacity="0.8"
    />
</svg>