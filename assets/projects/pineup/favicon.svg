<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <defs>
        <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#bf953f"/>
            <stop offset="50%" stop-color="#fcf6ba"/>
            <stop offset="100%" stop-color="#b38728"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect
        width="32"
        height="32"
        rx="7"
        fill="#070707"
    />

    <!-- Main Social Bubble -->
    <path
        d="M7 9
           C7 7.07 8.57 5.5 10.5 5.5
           H21.5
           C23.43 5.5 25 7.07 25 9
           V15
           C25 16.93 23.43 18.5 21.5 18.5
           H15
           L10.5 22
           V18.5
           H10.5
           C8.57 18.5 7 16.93 7 15
           Z"
        fill="none"
        stroke="url(#gold)"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Conversation Dots -->
    <circle cx="12" cy="12.25" r="1.05" fill="url(#gold)"/>
    <circle cx="16" cy="12.25" r="1.05" fill="url(#gold)"/>
    <circle cx="20" cy="12.25" r="1.05" fill="url(#gold)"/>

    <!-- Secondary Social Bubble -->
    <path
        d="M17.5 21
           H22
           C24.49 21 26 22.35 26 24.25
           C26 26.15 24.49 27.5 22 27.5
           H18
           L15.5 29
           L16.25 26.75
           C15.55 26.15 15.25 25.25 15.25 24.25
           C15.25 22.35 16.05 21.45 17.5 21
           Z"
        fill="#070707"
        stroke="url(#gold)"
        stroke-width="1.35"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Secondary Bubble Accent -->
    <circle
        cx="19.25"
        cy="24.25"
        r="0.75"
        fill="url(#gold)"
    />

    <circle
        cx="22"
        cy="24.25"
        r="0.75"
        fill="url(#gold)"
    />
</svg>
