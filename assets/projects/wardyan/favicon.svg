           C12.8 13.8 10.2 11.8 10.2 9.2
           C10.2 7.2 11.8 6 13.4 6
           C15.1 6 16 7.4 16 9.5
           C16 7.4 16.9 6 18.6 6
           C20.2 6 21.8 7.2 21.8 9.2
           C21.8 11.8 19.2 13.8 16 14.2Z"
        fill="none"
        stroke="url(#gold)"
        stroke-width="1.35"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <path
        d="M15.9 14
           C13.4 14.8 10.5 14.3 9.1 12.4
           C8 10.9 8.5 9.2 9.9 8.5
           C11.5 7.7 13.1 8.7 14.3 10.5
           C13.2 8.6 13.7 7 15.2 6.4
           C16.7 5.8 18.1 6.8 18.3 8.4
