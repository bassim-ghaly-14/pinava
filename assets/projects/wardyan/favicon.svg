    <!-- Left Leaf -->
    <path
        d="M15.6 21
           C12.7 19.7 10.5 20.3 9.4 22
           C11.3 23.3 13.6 23.2 15.6 21Z"
        fill="none"
        stroke="url(#gold)"
        stroke-width="1.15"
        stroke-linecap="round"
        stroke-linejoin="round"
    />

    <!-- Right Leaf -->
    <path
        d="M15.4 23
           C18.2 21.4 20.5 21.8 21.7 23.4
