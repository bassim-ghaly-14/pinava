<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page Not Found — Pinava</title>
    <meta name="description" content="The requested page could not be found. Return to the Pinava portfolio of Bassim Ghaly, Frontend Developer.">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="theme-color" content="#070707">
    <meta name="color-scheme" content="dark">
    <style>
        :root {
            --color-bg: #070707;
            --color-text: #f5f5f5;
            --color-text-secondary: #a0a0a0;
            --color-text-muted: #7a7a7a;
            --color-border: rgba(179, 135, 40, 0.15);
            --gold-primary: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 100%);
            --gold-solid: #b38728;
            --gold-light: #fcf6ba;
            --ease-out: cubic-bezier(0.25, 1, 0.5, 1);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            min-height: 100svh;
            display: grid;
            place-items: center;
            background-color: var(--color-bg);
            background-image: radial-gradient(ellipse at 20% 50%, #1a1510 0%, #070707 70%);
            color: var(--color-text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: 100%;
            max-width: 40rem;
            padding: clamp(2rem, 6vh, 4rem) clamp(1.25rem, 5vw, 2.5rem);
            text-align: center;
        }

        .code-404 {
            font-size: clamp(6rem, 28vw, 13rem);
            font-weight: 800;
            letter-spacing: 0.04em;
            line-height: 1;
            background: var(--gold-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            user-select: none;
        }

        .divider {
            width: 64px;
            height: 1px;
            margin: clamp(1.25rem, 3vh, 2rem) auto;
            background: var(--color-border);
            position: relative;
        }
        .divider::after {
            content: '';
            position: absolute;
            top: -1.5px;
            left: 50%;
            width: 5px;
            height: 5px;
            transform: translateX(-50%) rotate(45deg);
            background: var(--gold-solid);
        }

        h1 {
            font-size: clamp(1.4rem, 5vw, 2rem);
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .not-found-copy {
            color: var(--color-text-secondary);
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
            max-width: 30rem;
            margin: 0 auto clamp(1.75rem, 4vh, 2.5rem);
        }

        .btn-home {
            display: inline-block;
            min-height: 48px;
            padding: 0.85rem 2rem;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            background: var(--gold-primary);
            color: #000;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.02em;
            transition: transform 0.2s var(--ease-out), opacity 0.2s var(--ease-out);
        }
        .btn-home:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }
        .btn-home:focus-visible {
            outline: 2px solid var(--gold-light);
            outline-offset: 3px;
        }

        .not-found-hint {
            margin-top: 1.25rem;
            color: var(--color-text-muted);
            font-size: 0.85rem;
        }

        @media (prefers-reduced-motion: reduce) {
            .btn-home {
                transition: none;
            }
            .btn-home:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="code-404" aria-hidden="true">404</p>
        <div class="divider" aria-hidden="true"></div>
        <h1>Looks like this page got lost.</h1>
        <p class="not-found-copy">
            The page you&rsquo;re looking for doesn&rsquo;t exist or may have moved.
        </p>
        <a href="/" class="btn-home">&larr; Back Home</a>
        <p class="not-found-hint">Return to the portfolio and explore my work.</p>
    </main>
</body>
</html>
